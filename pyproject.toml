[project]
name = "econprior"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.36.1",
    "tqdm>=4.67.1",
    "pytest>=9.0.2",
    "typer>=0.21.0",
]

[project.scripts]
econprior = "econprior.cli:main"
ep = "econprior.cli:main"

[dependency-groups]
dev = [
    "connectorx>=0.4.4",
    "ipykernel>=7.1.0",
    "jupytext>=1.18.1",
    "nbconvert>=7.16.6",
    "pip>=25.3",
    "pyarrow>=22.0.0",
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econprior"]
